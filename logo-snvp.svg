<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 280" width="100%" height="100%">
  <defs>
    <linearGradient id="airplaneGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="airplaneGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <linearGradient id="snBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="vpGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
  </defs>

  <!-- Left: Stylized Supersonic Folded Plane -->
  <g transform="translate(10, 20)">
    <!-- Base dark blue wing -->
    <polygon points="170,105 30,150 170,185" fill="#1e3a8a" />
    <!-- Main top fuselage / light blue fold -->
    <polygon points="170,30 30,150 170,105" fill="url(#airplaneGrad1)" />
    <!-- Wing undertone shadow -->
    <polygon points="170,105 75,135 155,145" fill="#0284c7" opacity="0.8" />
    <!-- Bottom body fold -->
    <polygon points="170,105 155,145 170,185" fill="#1d4ed8" />
  </g>

  <!-- Letter S (Blue) -->
  <path d="M 300 65 C 275 65 245 75 245 105 C 245 135 305 125 305 150 C 305 165 290 170 275 170 C 255 170 240 160 230 150 L 210 175 C 225 195 250 205 278 205 C 315 205 345 185 345 150 C 345 115 285 125 285 102 C 285 90 298 88 305 88 C 320 88 335 95 342 105 L 362 82 C 348 70 328 65 300 65 Z" fill="url(#snBlue)" />

  <!-- Letter N (Blue) -->
  <path d="M 370 70 L 408 70 L 408 115 L 458 115 L 458 70 L 496 70 L 496 200 L 458 200 L 458 150 L 408 150 L 408 200 L 370 200 Z" fill="url(#snBlue)" rx="12" />

  <!-- Letter V (Yellow/Gold) -->
  <path d="M 505 70 L 538 70 L 565 160 L 592 70 L 625 70 L 585 198 C 578 218 552 218 545 198 Z" fill="url(#vpGold)" />

  <!-- Letter P (Yellow/Gold) with Aviation Emblem Inset -->
  <g transform="translate(625, 68)">
    <path d="M 15 2 C 7 2 0 9 0 17 L 0 128 C 0 136 7 142 15 142 L 35 142 C 43 142 50 136 50 128 L 50 90 L 78 90 C 112 90 135 72 135 45 C 135 18 112 2 78 2 Z" fill="url(#vpGold)" />
    
    <!-- Inner P Hole / Cutout -->
    <path d="M 48 24 L 75 24 C 92 24 102 32 102 45 C 102 58 92 68 75 68 L 48 68 Z" fill="#ffffff" />
    
    <!-- Garuda / Wings Silhouette inside P -->
    <path d="M 75 32 C 78 35 83 36 86 33 C 88 38 85 43 83 46 C 85 48 88 50 86 54 C 83 53 80 50 78 52 C 76 56 74 60 75 64 C 72 61 71 57 69 57 C 67 60 67 64 64 64 C 65 60 63 56 61 52 C 59 50 56 53 53 54 C 51 50 54 48 56 46 C 54 43 51 38 53 33 C 56 36 61 35 64 32 C 67 36 72 36 75 32 Z" fill="url(#vpGold)" />
  </g>

  <!-- Subtitle Text -->
  <text x="460" y="255" font-family="'Outfit', 'Inter', sans-serif" font-size="22" font-weight="800" text-anchor="middle" fill="#0f172a" letter-spacing="1.5">
    SEMINAR NASIONAL VOKASI PENERBANGAN
  </text>
</svg>
