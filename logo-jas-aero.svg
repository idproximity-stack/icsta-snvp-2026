<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 270" width="100%" height="100%">
  <!-- Icon on left -->
  <g transform="translate(15, 10)">
    <!-- Base rounded orange square -->
    <rect x="0" y="0" width="250" height="250" rx="36" fill="#f36c21" />
    
    <!-- Curved green aero band -->
    <clipPath id="squareClip">
      <rect x="0" y="0" width="250" height="250" rx="36" />
    </clipPath>
    
    <g clip-path="url(#squareClip)">
      <!-- Dark green accent line 1 -->
      <path d="M 0 230 C 90 220 180 150 210 0 L 225 0 C 190 160 100 235 0 245 Z" fill="#056839" />
      <!-- Lime green wing band -->
      <path d="M 0 230 C 90 220 180 150 210 0 L 250 0 C 250 140 200 250 0 250 Z" fill="#8dc63f" />
      <!-- Dark green accent line 2 inside lime band -->
      <path d="M 20 250 C 130 220 190 160 250 80 L 250 95 C 190 175 130 235 20 250 Z" fill="#056839" />
    </g>
  </g>

  <!-- Typography on right -->
  <!-- "JAS AERO" -->
  <text x="310" y="125" font-family="'Inter', 'Outfit', sans-serif" font-size="125" font-weight="900" fill="#242743" letter-spacing="1">
    JAS AERO
  </text>
  
  <!-- "Engineering" -->
  <text x="310" y="240" font-family="'Inter', 'Outfit', sans-serif" font-size="108" font-weight="400" fill="#242743" letter-spacing="-1">
    Engineering
  </text>
</svg>
